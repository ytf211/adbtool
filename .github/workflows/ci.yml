name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21.0.11+10"
          cache: gradle

      - name: Validate Gradle Wrapper
        run: echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Check conventions
        env:
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/check-conventions.sh

      - name: Run ShellCheck
        run: shellcheck bin/adbtool build.sh device/adbtool install.sh scripts/check-conventions.sh tests/shell/fake-adb tests/shell/run.sh tools/fetch-tools.sh

      - name: Test and build
        run: ./gradlew clean check assemble

      - name: Verify distribution
        run: |
          cd build/dist
          sha256sum -c ./*.sha256
          test "$(unzip -Z1 ./*.jar)" = "classes.dex"
