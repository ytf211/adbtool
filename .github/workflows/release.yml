name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21.0.11+10"
          cache: gradle

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?)$ ]] || {
            echo "Tag must be a semantic version such as v1.2.3" >&2
            exit 1
          }
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag must point to a commit on main" >&2
            exit 1
          }
          echo "value=${BASH_REMATCH[1]}" >>"$GITHUB_OUTPUT"

      - name: Validate Gradle Wrapper
        run: echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Run checks and build release assets
        run: |
          shellcheck bin/adbtool build.sh device/adbtool install.sh scripts/check-conventions.sh tests/shell/fake-adb tests/shell/run.sh tools/fetch-tools.sh
          ./gradlew clean check assemble -Pversion=${{ steps.version.outputs.value }}
          cd build/dist
          sha256sum -c ./*.sha256
          test "$(unzip -Z1 ./*.jar)" = "classes.dex"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
